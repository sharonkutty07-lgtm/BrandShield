<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BrandShield | Register Tenant</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  min-height: 100vh;
  display: grid;
  place-items: center;
  background-color: #060b14;
  background-image:
    linear-gradient(135deg, rgba(6, 12, 26, 0.92) 0%, rgba(8, 18, 38, 0.88) 100%),
    url('/static/images/dashboard_template.jpg');
  background-size: cover;
  background-position: center;
  font-family: 'Inter', -apple-system, sans-serif;
  color: #eaf2ff;
  padding: 24px;
}
.card {
  width: min(100%, 460px);
  padding: 36px;
  border: 1px solid rgba(6, 182, 212, 0.3);
  border-radius: 20px;
  background: rgba(10, 18, 34, 0.88);
  backdrop-filter: blur(20px);
  box-shadow: 0 25px 70px rgba(0, 0, 0, 0.7), 0 0 30px rgba(6, 182, 212, 0.15);
}
.logo-box {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 8px;
}
.logo-icon { font-size: 2rem; }
.logo-text { font-size: 1.6rem; font-weight: 800; color: #fff; letter-spacing: -0.02em; }
.badge {
  font-size: 0.68rem;
  background: rgba(6, 182, 212, 0.15);
  border: 1px solid rgba(6, 182, 212, 0.4);
  color: #22d3ee;
  padding: 2px 8px;
  border-radius: 999px;
  font-weight: 700;
  text-transform: uppercase;
}
.sub { color: #94a3b8; margin: 0 0 24px; font-size: 0.9rem; line-height: 1.5; }
label {
  display: block;
  font-size: 0.8rem;
  font-weight: 600;
  color: #cbd5e1;
  margin: 14px 0 6px;
  text-transform: uppercase;
  letter-spacing: 0.04em;
}
input {
  width: 100%;
  padding: 12px 14px;
  border-radius: 10px;
  border: 1px solid rgba(255, 255, 255, 0.15);
  background: rgba(6, 12, 24, 0.7);
  color: white;
  font-size: 15px;
  transition: all 0.2s;
}
input:focus {
  outline: none;
  border-color: #06b6d4;
  box-shadow: 0 0 10px rgba(6, 182, 212, 0.3);
}
button {
  width: 100%;
  margin-top: 24px;
  padding: 13px;
  border: 0;
  border-radius: 10px;
  background: linear-gradient(135deg, #06b6d4, #3b82f6);
  color: #fff;
  font-weight: 700;
  font-size: 15px;
  cursor: pointer;
  transition: transform 0.2s, box-shadow 0.2s;
}
button:hover {
  transform: translateY(-2px);
  box-shadow: 0 0 20px rgba(6, 182, 212, 0.4);
}
.message {
  padding: 10px 14px;
  border-radius: 8px;
  background: rgba(239, 68, 68, 0.2);
  border: 1px solid #ef4444;
  color: #fca5a5;
  margin: 14px 0;
  font-size: 0.85rem;
}
.foot { margin-top: 24px; color: #94a3b8; text-align: center; font-size: 14px; }
a { color: #06b6d4; text-decoration: none; font-weight: 600; }
a:hover { text-decoration: underline; }
</style>
</head>
<body>
<main class="card">
  <div class="logo-box">
    <span class="logo-icon">🛡️</span>
    <div>
      <div class="logo-text">BrandShield</div>
      <span class="badge">HACXLERATE 2026 #03</span>
    </div>
  </div>
  <p class="sub">Register a new security analyst tenant to deploy continuous external defense.</p>

  {% if message %}<div class="message">{{ message }}</div>{% endif %}

  <form method="post" action="/register">
    <label for="full_name">Full Name</label>
    <input id="full_name" name="full_name" autocomplete="name" placeholder="e.g. Alex Vance" maxlength="150" required>

    <label for="email">Corporate Security Email</label>
    <input id="email" name="email" type="email" autocomplete="email" placeholder="e.g. alex@yourcompany.com" required>

    <label for="password">Password (at least 8 characters)</label>
    <input id="password" name="password" type="password" autocomplete="new-password" minlength="8" required>

    <label for="confirm_password">Confirm Password</label>
    <input id="confirm_password" name="confirm_password" type="password" autocomplete="new-password" minlength="8" required>

    <div style="margin-top:14px; font-size:12px; color:#94a3b8; display:flex; align-items:center; gap:6px; background:rgba(6, 182, 212, 0.08); padding:8px 12px; border-radius:8px; border:1px solid rgba(6, 182, 212, 0.2);">
      <span>✉️</span> A 6-digit OTP code will be sent to your email to verify identity.
    </div>

    <button type="submit">Create Tenant Account & Verify OTP ➜</button>
  </form>

  <div class="foot">
    Already registered? <a href="/login">Sign in here</a>
  </div>
</main>
</body>
</html>
